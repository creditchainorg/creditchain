[book]
authors = ["CreditChain Research Team"]
language = "en"
multilingual = false
src = "book"
title = "CreditChain Book"
description = "A book on CreditChain node, protocol, and operator workflows"

[output.html]
theme = "book/theme"
git-repository-url = "https://github.com/creditchainorg/creditchain"
default-theme = "ayu"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[build]
build-dir = "target/book"

[preprocessor.template]
before = ["links"]

[preprocessor.index]

[preprocessor.links]
