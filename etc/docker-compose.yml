name: creditchain

services:
  creditchaind:
    restart: unless-stopped
    image: ghcr.io/openibank/creditchain
    ports:
      - "9001:9001" # metrics
      - "30303:30303" # eth/66 peering
      - "8545:8545" # rpc
      - "8551:8551" # engine
    volumes:
      - mainnet_data:/root/.local/share/creditchain/mainnet
      - testnet_data:/root/.local/share/creditchain/testnet
      - devnet_data:/root/.local/share/creditchain/devnet
      - local_data:/root/.local/share/creditchain/local-single
      - logs:/root/logs
      - ./jwttoken:/root/jwt/:ro
      - ../genesis:/config/genesis:ro
    # https://docs.creditchain.org/run/troubleshooting#concurrent-database-access-error-using-containersdocker
    pid: host
    # For public environments, pass an explicit CreditChain genesis file.
    command: >
      node
      --chain /config/genesis/local-single.json
      --metrics 0.0.0.0:9001
      --log.file.directory /root/logs
      --authrpc.addr 0.0.0.0
      --authrpc.port 8551
      --authrpc.jwtsecret /root/jwt/jwt.hex
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api "eth,net,web3"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus
    depends_on:
      - creditchaind
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  loki:
    restart: unless-stopped
    image: grafana/loki:latest
    ports:
      - 3100:3100
    volumes:
      - ./loki/:/etc/loki/
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml

  promtail:
    restart: unless-stopped
    image: grafana/promtail:latest
    depends_on:
      - loki
    volumes:
      - ./promtail/:/etc/promtail/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    depends_on:
      - creditchaind
      - prometheus
      - loki
    ports:
      - 3000:3000
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning_temp/dashboards
    # 1. Copy dashboards from temp directory to prevent modifying original host files
    # 2. Replace Prometheus datasource placeholders with the actual name
    # 3. Run Grafana
    entrypoint: >
      sh -c "cp -r /etc/grafana/provisioning_temp/dashboards/. /etc/grafana/provisioning/dashboards &&
             find /etc/grafana/provisioning/dashboards/ -name '*.json' -exec sed -i 's/$${DS_PROMETHEUS}/Prometheus/g' {} \+ &&
             find /etc/grafana/provisioning/dashboards/ -name '*.json' -exec sed -i 's/$${datasource}/Prometheus/g' {} \+ &&
             find /etc/grafana/provisioning/dashboards/ -name '*.json' -exec sed -i 's/$${VAR_INSTANCE_LABEL}/instance/g' {} \+ &&
             /run.sh"

volumes:
  mainnet_data:
    driver: local
  testnet_data:
    driver: local
  devnet_data:
    driver: local
  local_data:
    driver: local
  logs:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
