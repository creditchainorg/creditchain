# Runs all `stage run` commands.

name: stage-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FROM_BLOCK: 0
  TO_BLOCK: 50000
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  stage:
    name: stage-run-test
    # Only run stage commands test in merge groups
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.repository == 'paradigmxyz/reth' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    env:
      RUST_LOG: info,sync=error
      RUST_BACKTRACE: 1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build CreditChain
        run: |
          cargo install --locked --path bin/reth --bin creditchaind
      - name: Run headers stage
        run: |
          creditchaind stage run headers --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run bodies stage
        run: |
          creditchaind stage run bodies --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run senders stage
        run: |
          creditchaind stage run senders --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run execution stage
        run: |
          creditchaind stage run execution --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      # NOTE: account-hashing, storage-hashing, and hashing stages are omitted.
      # With storage v2 (now default), these stages are no-ops because the
      # execution stage writes directly to HashedAccounts/HashedStorages.
      # Running them here is harmful: `stage run` unwinds before executing,
      # and the unwind reverts the hashed state that execution wrote, but
      # the no-op execute never restores it — causing merkle to fail.
      - name: Run merkle stage
        run: |
          creditchaind stage run merkle --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run transaction lookup stage
        run: |
          creditchaind stage run tx-lookup --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run account history stage
        run: |
          creditchaind stage run account-history --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
      - name: Run storage history stage
        run: |
          creditchaind stage run storage-history --from ${{ env.FROM_BLOCK }} --to ${{ env.TO_BLOCK }} --commit --checkpoints
