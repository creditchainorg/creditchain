[environment]
name = "mainnet"
display_name = "CreditChain Mainnet"
chain_id = 2026042405
reset_policy = "production-no-resets"
# No genesis yet. It is produced by the offline key ceremony and published, with its hash,
# before launch; `--chain creditchain-mainnet` refuses to start until then.
genesis = ""
binary = "creditchaind"

[rpc]
http_url = "https://rpc.creditchain.org"
metrics_port = 9001

[network]
discovery = true
bootnodes = []

[links]
website = "https://www.creditchain.org"
docs = "https://docs.creditchain.org"
